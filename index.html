<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBA学习推进看板</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- 顶部导航 -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-chart-line"></i>
                <h1>MBA学习推进看板</h1>
            </div>
            <nav class="nav">
                <button class="nav-btn active" data-page="dashboard">
                    <i class="fas fa-home"></i> 首页
                </button>
                <button class="nav-btn" data-page="logic">
                    <i class="fas fa-brain"></i> 逻辑
                </button>
                <button class="nav-btn" data-page="math">
                    <i class="fas fa-calculator"></i> 数学
                </button>
                <button class="nav-btn" data-page="english">
                    <i class="fas fa-language"></i> 英语
                </button>
                <button class="nav-btn" data-page="writing">
                    <i class="fas fa-pen-fancy"></i> 写作
                </button>
            </nav>
        </header>

        <!-- 主要内容区域 -->
        <main class="main-content">
            <!-- 首页 -->
            <section id="dashboard" class="page active">
                <div class="dashboard-header">
                    <h2><i class="fas fa-tachometer-alt"></i> 学习仪表板</h2>
                    <p class="subtitle">你的个人学习推进中心</p>
                </div>

                <div class="today-status card">
                    <h3><i class="fas fa-calendar-day"></i> 今日学习状态</h3>
                    <div class="subject-today-cards">
                        <!-- 动态生成 -->
                    </div>
                </div>

                <div class="dashboard-grid">
                    <div class="stage-overview card">
                        <h3><i class="fas fa-map-signs"></i> 当前学习阶段</h3>
                        <div class="stage-cards">
                            <!-- 动态生成 -->
                        </div>
                    </div>

                    <div class="recent-activity card">
                        <h3><i class="fas fa-history"></i> 最近学习记录</h3>
                        <div class="recent-list">
                            <!-- 动态生成 -->
                        </div>
                    </div>
                </div>

                <div class="motivation card">
                    <h3><i class="fas fa-heart"></i> 学习提示</h3>
                    <p class="motivation-text">推进比完美更重要。即使只学习10分钟，也值得记录。</p>
                    <div class="progress-tip">
                        <i class="fas fa-lightbulb"></i>
                        <span>完成一个单元的状态更新，就能在进度条上前进一步。</span>
                    </div>
                </div>
            </section>

            <!-- 逻辑页面 -->
            <section id="logic" class="page">
                <div class="subject-header">
                    <div class="subject-title">
                        <h2><i class="fas fa-brain"></i> 逻辑</h2>
                        <div class="stage-badge logic-color">认识结构</div>
                    </div>
                    <p class="subject-description">基于《逻辑攻略》结构化学习</p>
                </div>

                <div class="modules-container">
                    <!-- 动态生成逻辑模块 -->
                </div>
            </section>

            <!-- 数学页面 -->
            <section id="math" class="page">
                <div class="subject-header">
                    <div class="subject-title">
                        <h2><i class="fas fa-calculator"></i> 数学</h2>
                        <div class="stage-badge math-color">认识结构</div>
                    </div>
                    <p class="subject-description">基于《高分指南》结构化学习</p>
                </div>

                <div class="modules-container">
                    <!-- 动态生成数学模块 -->
                </div>
            </section>

            <!-- 英语页面 -->
            <section id="english" class="page">
                <div class="subject-header">
                    <div class="subject-title">
                        <h2><i class="fas fa-language"></i> 英语</h2>
                        <div class="stage-badge english-color">认识结构</div>
                    </div>
                    <p class="subject-description">高频词群与阅读句学习</p>
                </div>

                <div class="modules-container">
                    <!-- 动态生成英语模块 -->
                </div>
            </section>

            <!-- 写作页面 -->
            <section id="writing" class="page">
                <div class="subject-header">
                    <div class="subject-title">
                        <h2><i class="fas fa-pen-fancy"></i> 写作</h2>
                        <div class="stage-badge writing-color">认识结构</div>
                    </div>
                    <p class="subject-description">结构拆解与模板积累</p>
                </div>

                <div class="modules-container">
                    <!-- 动态生成写作模块 -->
                </div>
            </section>
        </main>

        <!-- 底部信息 -->
        <footer class="footer">
            <p>航崽专属</p>
        </footer>
    </div>

    <!-- JavaScript文件 -->
    <script src="app.js"></script>
</body>
</html>
